services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      MONITOR_ENVIRONMENT: production
      UV_CACHE_DIR: /tmp/uv-cache
      MONITOR_HOST: 0.0.0.0
      MONITOR_ALLOWED_ORIGINS: '["http://127.0.0.1:8099","http://localhost:8099","http://127.0.0.1","http://localhost"]'
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - "127.0.0.1:8099:80"
    depends_on:
      backend:
        condition: service_healthy
