[project]
name = "monitor"
version = "0.1.0"
description = "Linux System Health Dashboard - Backend"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Linux System Health Dashboard Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-randomly>=3.15.0",
    "hypothesis>=6.92.0",
    "httpx>=0.27.0",
    "jsonschema>=4.24",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "import-linter>=2.10.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --cov=src/monitor --cov-branch --cov-report=term-missing"
asyncio_mode = "auto"
timeout = 10
markers = [
    "unit: fast, pure, no I/O",
    "integration: real adapters/fixtures, localhost only",
    "e2e: full stack with browser",
    "perf: benchmarks and load (not in default run)",
    "soak: long-running (nightly)",
    "privileged: needs elevated permissions (opt-in)",
    "quarantine: known flaky, tracked by an issue",
]
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "SIM", "ARG", "PTH", "ERA", "PL", "TRY", "TID", "RUF",
]
ignore = ["S101", "TRY003", "PLC0415", "PLW0603", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "TRY401", "TRY203", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "TRY003", "PL", "TID252", "E501", "ARG001", "ARG002", "ARG005"]

[tool.ruff.lint.isort]
known-first-party = ["monitor"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
no_implicit_optional = true
no_implicit_reexport = true
check_untyped_defs = true
namespace_packages = true
exclude = [
    '(?s).*/\.venv/.*',
    '(?s).*/build/.*',
    '(?s).*/dist/.*',
    '(?s).*/tests/.*',
    '(?s).*/__pycache__/.*',
]
[[tool.mypy.overrides]]
module = "pytest"
ignore_missing_imports = true

[tool.importlinter]
root_package = "monitor"

[[tool.importlinter.contracts]]
name = "domain_no_infra"
type = "forbidden"
source_modules = ["monitor.domain"]
forbidden_modules = ["monitor.infrastructure", "monitor.presentation"]

[[tool.importlinter.contracts]]
name = "domain_no_pres"
type = "forbidden"
source_modules = ["monitor.domain"]
forbidden_modules = ["monitor.presentation"]

[[tool.importlinter.contracts]]
name = "application_no_infra"
type = "forbidden"
source_modules = ["monitor.application"]
forbidden_modules = ["monitor.infrastructure", "monitor.presentation"]

[[tool.importlinter.contracts]]
name = "application_no_pres"
type = "forbidden"
source_modules = ["monitor.application"]
forbidden_modules = ["monitor.presentation"]

[[tool.importlinter.contracts]]
name = "presentation_no_infra"
type = "forbidden"
source_modules = ["monitor.presentation"]
forbidden_modules = ["monitor.infrastructure"]
ignore_imports = [
    "monitor.presentation.api.app -> monitor.composition",
    "monitor.composition -> monitor.infrastructure.psutil_cpu",
    "monitor.composition -> monitor.infrastructure.psutil_memory",
    "monitor.composition -> monitor.infrastructure.system_clock",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = ["B101"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-randomly>=3.15.0",
    "hypothesis>=6.92.0",
    "httpx>=0.27.0",
    "jsonschema>=4.24",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "import-linter>=2.10.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]
